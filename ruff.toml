# Ruff configuration (PEP 8 check, PRD task 8.4.2).
# Dev tool only: install with `pip install ruff` (not in requirements.txt).
line-length = 79
extend-exclude = ['.venv']

[lint]
select = ['E', 'W', 'F', 'I', 'Q']

[lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[lint.per-file-ignores]
# Auto-generated migrations: allow long lines, keep the quote check.
'*/migrations/*.py' = ['E501']
